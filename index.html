<!doctype html>
<html lang="fr">

<head>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title> Bastien's personal page </title>

	<link rel="stylesheet" href="/style/style.css"/>
	<link rel="stylesheet" href="/style/contact.css"/>
	<link rel="stylesheet" href="/style/home.css"/>
	<link rel="stylesheet" href="/style/about/about.css"/>
	<link rel="stylesheet" href="/style/fonts.css"/>
	<link rel="stylesheet" href="/style/font-page.css"/>
	<link rel="stylesheet" href="/style/about/timeline.css"/>
	<link rel="stylesheet" href="/style/about/projects.css"/>
	<link rel="stylesheet" href="/style/about/personality.css"/>
	<link rel="stylesheet" href="/style/about/experience.css"/>
	<link rel="stylesheet" href="/style/website.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/devicon.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap">

	<!-- <script src="assets/main.js"></script> -->
	<link rel="icon" type="image/x-icon" href="icon/watermelon.ico">
	<!-- Global site tag (gtag.js) - Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-WHQKH19ZS9"></script>
	<script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-EBMWYZ6XSF');
	</script>
</head>

<body>
    <!-- macOS Menubar -->
    <div class="mac-menubar" id="mac-menubar">
        <div class="mac-menubar-left">
            <span class="mac-apple">&#63743;</span>
            <span class="mac-menu-app">Bastien's Page</span>
        </div>
        <div class="mac-menubar-right">
            <button type="button" class="mac-status-btn" id="mac-wifi-btn" title="Network"><i class="fas fa-wifi" id="mac-wifi-icon"></i></button>
            <button type="button" class="mac-status-btn" id="mac-sound-btn" title="Sound"><i class="fas fa-volume-up" id="mac-sound-icon"></i></button>
            <button type="button" class="mac-status-btn mac-battery-wrap" id="mac-battery-btn" title="Battery">
                <i class="fas fa-battery-full" id="mac-battery-icon"></i><span id="mac-battery-text"></span>
            </button>
            <span class="mac-datetime" id="mac-datetime"></span>
        </div>
    </div>

    <!-- macOS Panels -->
    <div class="mac-panel" id="mac-wifi-panel">
        <div class="mac-panel-header">
            <i class="fas fa-wifi mac-panel-icon" id="mac-wifi-panel-icon"></i>
            <span class="mac-panel-title">Network</span>
        </div>
        <div class="mac-panel-row" id="mac-wifi-detail">
            <span class="mac-dot mac-dot-green"></span><span>Connected</span>
        </div>
    </div>

    <div class="mac-panel" id="mac-sound-panel">
        <div class="mac-panel-header">
            <i class="fas fa-volume-up mac-panel-icon" id="mac-sound-panel-icon"></i>
            <span class="mac-panel-title">Sound</span>
            <span class="mac-panel-value" id="mac-sound-value">75%</span>
        </div>
        <div class="mac-panel-slider-row">
            <i class="fas fa-volume-down mac-panel-sm"></i>
            <div class="mac-panel-track">
                <div class="mac-panel-fill" id="mac-sound-fill"></div>
                <input type="range" class="mac-range" id="mac-sound-range" min="0" max="100" value="75" title="Volume" aria-label="Volume" />
            </div>
            <i class="fas fa-volume-up mac-panel-sm"></i>
        </div>
    </div>

    <div class="mac-panel" id="mac-battery-panel">
        <div class="mac-panel-header">
            <i class="fas fa-battery-full mac-panel-icon" id="mac-battery-icon-lg"></i>
            <span class="mac-panel-title">Battery</span>
            <span class="mac-panel-value" id="mac-battery-pct">—</span>
        </div>
        <div class="mac-panel-track mac-battery-track">
            <div class="mac-panel-fill mac-battery-fill" id="mac-battery-fill"></div>
        </div>
        <div class="mac-panel-sub" id="mac-battery-status">—</div>
    </div>

    <div id="app" class="app row" :class="{ 'fullscreen': isWindowFullscreen }">
        <h1 class="main-title" :class="{ 'minimized': isWindowMinimized, 'fullscreen': isWindowFullscreen }">
            {{title}}
        </h1>
        <div class="main-content">
            <div class="window" :class="{ 'minimized': isWindowMinimized, 'fullscreen': isWindowFullscreen }">
                <div class="window-header">
                    <div class="button red" @click="closeWindow" title="Fermer"></div>
                    <div class="button yellow" @click="minimizeWindow" title="Réduire"></div>
                    <div class="button green" @click="maximizeWindow" title="Agrandir"></div>
                </div>
                <div class="navbar">
                    <div class="navbar-tabs">
                        <a @click="homeFunction">Home</a>
                        <a @click="aboutFunction">About myself</a>
                        <div class="dropdown" :class="{ show: showDropdown }" @mouseenter="showDropdownWithDelay" @mouseleave="hideDropdownWithDelay">
                            <button class="dropdown-btn" @click="toggleDropdown">▼ For developers</button>
                            <div class="dropdown-content" @mouseenter="showDropdownWithDelay" @mouseleave="hideDropdownWithDelay">
                                <a @click="fontsFunction">Fonts</a>
                                <a @click="developmentFunction">Coming soon</a>
                                <a @click="developmentFunction">Coming soon</a>
                            </div>
                        </div>
                        <a @click="contactFunction">Contact</a>
                        <a @click="thisWebSiteFunction">This website</a>
                    </div>
                    <button @click="toggleTheme" class="apple-toggle" :class="{ 'active': isDarkTheme }" :title="isDarkTheme ? 'Switch to Light Theme' : 'Switch to Dark Theme'">
                        <div class="toggle-slider">
                            <i :class="isDarkTheme ? 'fas fa-moon' : 'fas fa-sun'"></i>
                        </div>
                        <span class="sr-only">{{ isDarkTheme ? 'Switch to Light Theme' : 'Switch to Dark Theme' }}</span>
                    </button>
                </div>
                <div class="window-content">
                    <div v-if="componentStatus['fonts']" class="fonts-page-container">
                        <fonts/>
                    </div>
                    <div v-if="componentStatus['home']">
                        <home />
                    </div>
                    <div v-if="componentStatus['about']">
                        <about />
                    </div>
                    <div v-if="componentStatus['contact']">
                        <contact />
                    </div>
                    <div v-if="componentStatus['website']">
                        <website />
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Dock macOS -->
        <div class="dock" :class="{ 'visible': isWindowMinimized }">
            <div class="dock-container">
                <div class="dock-item" @click="restoreWindow" title="Bastien's Website">
                    <img src="icon/watermelon.ico" alt="Website Icon" />
                    <span class="dock-label">Website</span>
                </div>
            </div>
        </div>
        
        <footer :class="{ 'minimized': isWindowMinimized }">
            <small>Bastien Jacquelin © </small>
        </footer>
    </div>



    <script>
    (function () {
        // ── Clock ────────────────────────────────────────
        var DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        function updateClock() {
            var now = new Date();
            var el = document.getElementById('mac-datetime');
            if (el) el.textContent = DAYS[now.getDay()] + ' ' + now.getDate() + ' ' +
                MONTHS[now.getMonth()] + '  ' +
                String(now.getHours()).padStart(2,'0') + ':' +
                String(now.getMinutes()).padStart(2,'0');
        }
        updateClock();
        setInterval(updateClock, 10000);

        // ── Battery ──────────────────────────────────────
        var batteryObj = null;
        function batteryIcon(lvl) {
            return 'fas ' + (lvl > 87 ? 'fa-battery-full' :
                             lvl > 62 ? 'fa-battery-three-quarters' :
                             lvl > 37 ? 'fa-battery-half' :
                             lvl > 12 ? 'fa-battery-quarter' : 'fa-battery-empty');
        }
        function batteryColor(lvl) {
            return lvl > 50 ? '#4ade80' : lvl > 20 ? '#facc15' : '#f87171';
        }
        function refreshBattery() {
            if (!batteryObj) return;
            var lvl     = Math.round(batteryObj.level * 100);
            var charging = batteryObj.charging;
            var txt  = document.getElementById('mac-battery-text');
            var ico  = document.getElementById('mac-battery-icon');
            var icoL = document.getElementById('mac-battery-icon-lg');
            var pct  = document.getElementById('mac-battery-pct');
            var fill = document.getElementById('mac-battery-fill');
            var stat = document.getElementById('mac-battery-status');
            var btn  = document.getElementById('mac-battery-btn');
            if (txt)  txt.textContent  = ' ' + lvl + '%';
            if (ico)  ico.className    = batteryIcon(lvl);
            if (icoL) icoL.className   = 'fas ' + (batteryIcon(lvl).split(' ')[1]) + ' mac-panel-icon';
            if (pct)  pct.textContent  = lvl + '%';
            if (fill) { fill.style.width = lvl + '%'; fill.style.background = charging ? '#60a5fa' : batteryColor(lvl); }
            if (stat) stat.textContent = charging ? '⚡ Charging' : (lvl < 20 ? '⚠ Low battery' : 'On battery');
            if (btn)  btn.classList.toggle('mac-battery-charging', charging);
        }
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function (bat) {
                batteryObj = bat;
                refreshBattery();
                bat.addEventListener('levelchange', refreshBattery);
                bat.addEventListener('chargingchange', refreshBattery);
            });
        }

        // ── WiFi ─────────────────────────────────────────
        function refreshWifi() {
            var online = navigator.onLine;
            var ico    = document.getElementById('mac-wifi-icon');
            var picoEl = document.getElementById('mac-wifi-panel-icon');
            var det    = document.getElementById('mac-wifi-detail');
            var btn    = document.getElementById('mac-wifi-btn');
            if (ico)    { ico.style.opacity = online ? '1' : '0.3'; }
            if (picoEl) { picoEl.style.color = online ? '' : '#f87171'; }
            if (det)    det.innerHTML = online
                ? '<span class="mac-dot mac-dot-green"></span><span>Connected</span>'
                : '<span class="mac-dot mac-dot-red"></span><span>No connection</span>';
            if (btn)    btn.classList.toggle('mac-btn-offline', !online);
        }
        refreshWifi();
        window.addEventListener('online',  refreshWifi);
        window.addEventListener('offline', refreshWifi);

        // ── Sound slider ─────────────────────────────────
        var soundRange = document.getElementById('mac-sound-range');
        function refreshSound(val) {
            var fill  = document.getElementById('mac-sound-fill');
            var value = document.getElementById('mac-sound-value');
            var ico   = document.getElementById('mac-sound-icon');
            var pico  = document.getElementById('mac-sound-panel-icon');
            var cls   = val > 50 ? 'fa-volume-up' : val > 0 ? 'fa-volume-down' : 'fa-volume-mute';
            if (fill)  fill.style.width = val + '%';
            if (value) value.textContent = val + '%';
            if (ico)   ico.className = 'fas ' + cls;
            if (pico)  pico.className = 'fas ' + cls + ' mac-panel-icon';
        }
        if (soundRange) {
            refreshSound(soundRange.value);
            soundRange.addEventListener('input', function () { refreshSound(this.value); });
        }

        // ── Panel toggle ─────────────────────────────────
        function openPanel(panelId, btnId) {
            var panels = document.querySelectorAll('.mac-panel');
            panels.forEach(function (p) {
                if (p.id !== panelId) { p.classList.remove('active'); }
            });
            var panel = document.getElementById(panelId);
            var btn   = document.getElementById(btnId);
            if (!panel || !btn) return;
            var rect = btn.getBoundingClientRect();
            panel.style.right = (window.innerWidth - rect.right) + 'px';
            panel.classList.toggle('active');
        }

        document.getElementById('mac-wifi-btn').addEventListener('click', function (e) {
            e.stopPropagation(); openPanel('mac-wifi-panel', 'mac-wifi-btn');
        });
        document.getElementById('mac-sound-btn').addEventListener('click', function (e) {
            e.stopPropagation(); openPanel('mac-sound-panel', 'mac-sound-btn');
        });
        document.getElementById('mac-battery-btn').addEventListener('click', function (e) {
            e.stopPropagation(); openPanel('mac-battery-panel', 'mac-battery-btn');
        });

        document.addEventListener('click', function () {
            document.querySelectorAll('.mac-panel').forEach(function (p) { p.classList.remove('active'); });
            document.querySelectorAll('.mac-status-btn').forEach(function (b) { b.classList.remove('mac-btn-active'); });
        });
        document.querySelectorAll('.mac-panel').forEach(function (p) {
            p.addEventListener('click', function (e) { e.stopPropagation(); });
        });
    })();
    </script>

    <script type="module">

        import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
        import Fonts from '/views/development/fonts.js';
        import Home from '/views/home.js';
        import Contact from '/views/contact.js';
        import About from '/views/about/about.js';
        import Timeline from '/views/about/timeline/timeline.js';
        import Projects from '/views/about/projects.js';
        import Item from '/views/about/item.js';
        import Personality from '/views/about/personality.js';
        import Experience from '/views/about/experience.js';
        import Website from '/views/website.js';
        const app = createApp({
            created()
            {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark') {
                    this.isDarkTheme = true;
                    document.body.classList.remove('light-theme');
                } else {
                    this.isDarkTheme = false;
                    document.body.classList.add('light-theme');
                }
            },
            mounted()
            {
                // Fermer le menu déroulant si on clique en dehors
                document.addEventListener('click', (event) => {
                    const dropdown = event.target.closest('.dropdown');
                    if (!dropdown) {
                        this.showDropdown = false;
                    }
                });
            },
            data(){
                return{
                    title:'Bastien\'s personal page',
                    componentStatus : {
                        'home': true,
                        'development': false,
                        'fonts': false,
                        'about': false,
                        'contact': false,
                        'website': false,
                    },
                    isDarkTheme: false,
                    showDropdown: false,
                    dropdownTimeout: null,
                    isWindowMinimized: false,
                    isWindowFullscreen: false
                }
            },
            methods:{
                developmentFunction(){
                    this.showDropdown = false; // Fermer le menu déroulant
                    this.setValueToFalse(this.componentStatus);
                    this.title = "Development tools";
                },
                fontsFunction(){
                    this.showDropdown = false; // Fermer le menu déroulant
                    this.developmentFunction()
                    this.setValueToFalse(this.componentStatus);
                    this.componentStatus['fonts'] = true;
                },
                homeFunction(){
                    this.setValueToFalse(this.componentStatus);
                    this.componentStatus['home'] = true;
                    this.title = "Bastien's personal page";
                },
                aboutFunction(){
                    this.setValueToFalse(this.componentStatus);
                    this.componentStatus['about'] = true;
                    this.title = "About Myself";
                },                
                contactFunction(){
                    this.setValueToFalse(this.componentStatus);
                    this.componentStatus['contact'] = true;
                    this.title = "Contact";
                },
                thisWebSiteFunction(){
                    this.setValueToFalse(this.componentStatus);
                    this.componentStatus['website'] = true;
                    this.title = "About this website";
                },
                toggleTheme() {
                    this.isDarkTheme = !this.isDarkTheme;
                    // Utiliser light-theme pour le thème clair, pas de classe pour le thème sombre
                    if (this.isDarkTheme) {
                        document.body.classList.remove('light-theme');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        document.body.classList.add('light-theme');
                        localStorage.setItem('theme', 'light');
                    }
                },
                toggleDropdown() {
                    this.showDropdown = !this.showDropdown;
                },
                showDropdownWithDelay() {
                    if (this.dropdownTimeout) {
                        clearTimeout(this.dropdownTimeout);
                        this.dropdownTimeout = null;
                    }
                    this.showDropdown = true;
                },
                hideDropdownWithDelay() {
                    this.dropdownTimeout = setTimeout(() => {
                        this.showDropdown = false;
                        this.dropdownTimeout = null;
                    }, 500);
                },
                setValueToFalse(componentStatus){
                    for (const key in componentStatus) {
                        componentStatus[key] = false;
                    }
                },
                closeWindow() {
                    this.isWindowMinimized = false;
                },
                minimizeWindow() {
                    this.isWindowMinimized = true;
                },
                maximizeWindow() {
                    console.log('Bouton vert cliqué - État actuel:', this.isWindowFullscreen);
                    this.isWindowFullscreen = !this.isWindowFullscreen;
                    this.isWindowMinimized = false;
                    console.log('Nouvel état plein écran:', this.isWindowFullscreen);
                    
                    // Forcer l'application des classes CSS
                    this.$nextTick(() => {
                        const app = document.getElementById('app');
                        if (this.isWindowFullscreen) {
                            app.classList.add('fullscreen');
                            console.log('Classe fullscreen ajoutée');
                        } else {
                            app.classList.remove('fullscreen');
                            console.log('Classe fullscreen supprimée');
                        }
                    });
                },
                restoreWindow() {
                    this.isWindowMinimized = false;
                }
            }
        });
        app.component('Fonts', Fonts)
            .component('Home', Home)
            .component('Contact', Contact)
            .component('About', About)
            .component('Timeline', Timeline)
            .component('Projects', Projects)
            .component('Item', Item)
            .component('Personality', Personality)
            .component('Experience', Experience)
            .component('Website', Website)
        app.mount('#app');
    </script>    
</body>

</html>
